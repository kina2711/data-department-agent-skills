    expected_primary_skill: machine-learning-engineering
    rejected_skill: data-engineering
    expected_task: mle-optimize-inference-performance
  # Haiku answers mlops. Degraded mode and rollback are operational, so the reading holds. The
  # case keeps ML engineering because the fallback is built into the serving code rather than
  # configured around it.
  - id: mle-vs-ae-fallback
    query: Khi model chính lỗi hoặc quá hạn, cần timeout, giá trị mặc định, quay về bản trước và chế độ suy giảm.
    expected_primary_skill: machine-learning-engineering
    rejected_skill: analytics-engineering
    expected_task: mle-implement-model-fallback
  # Haiku answers data-platform-and-dataops, and provisioning is what that skill does. The case
  # keeps mlops because the reproducibility being asked for is of a training run, which is an ML
  # concern the platform baseline does not cover.
  - id: mlops-vs-platform-environment
    query: "Tạo môi trường chạy ML tái lập được: compute, runtime và quyền truy cập."
    expected_primary_skill: mlops
    rejected_skill: data-platform-and-dataops
