  # Seven of these thirty-seven route somewhere other than the expected skill, and none of them
  # route to the named rival — the model picks a third skill instead. That is the finding worth
  # keeping: the pairs I designed are not the confusion that happens. Each miss carries a note
  # above it saying what the model answers and why the case still expects what it expects. One
  # case was mine to fix rather than the model's: it listed eight cross-role concerns, so
  # data-department-orchestrator was the correct answer, and the query is now narrower.
  # Measured at 78.4% skill accuracy over 37 cases against claude-haiku-4-5-20251001.
  # --- R2 pairs whose names collide across skills -------------------------------------------
  # Selected by measurement rather than by taste: these are the uncovered R2 tasks that share
  # most of their name with a task in another skill, which is the shape a router actually
  # confuses. Each query is written so only one of the two can answer it.
  - id: bi-vs-meta-source-authority
    query: Doanh thu đang có ba con số khác nhau trên ba dashboard. Chốt xem KPI doanh thu lấy từ nguồn nào là chuẩn, theo từng dimension và từng use case báo cáo.
    expected_primary_skill: business-intelligence
    rejected_skill: metadata-engineering-and-catalog
    expected_task: bi-build-source-authority-matrix
  - id: meta-vs-bi-source-authority
    query: Với entity Customer, xác định hệ thống nào là authoritative source cho từng field và ghi vào catalog để mọi nhóm tra được.
    expected_primary_skill: metadata-engineering-and-catalog
    rejected_skill: business-intelligence
    expected_task: meta-build-source-authority-matrix
  - id: brain-vs-enable-concept-map
