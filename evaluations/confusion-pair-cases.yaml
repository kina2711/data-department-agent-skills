    rejected_skill: analytics-engineering
    expected_task: de-write-pipeline-tests
  # Haiku answers data-documentation-and-diagrams, which is the most defensible of these misses:
  # a runbook is a document. The case keeps data engineering because the contract owns the alerts
  # and recovery steps the runbook describes, and whoever runs the pipeline writes them.
  - id: de-vs-mlops-runbook
    query: "Viết runbook vận hành cho pipeline ingest: cảnh báo, cách khôi phục và ai trực."
    expected_primary_skill: data-engineering
    rejected_skill: mlops
    expected_task: de-create-pipeline-runbook
  # Haiku answers data-engineering. Renaming and casting sounds like ingestion, and at the
  # boundary between the two skills it nearly is. The case keeps analytics engineering because a
  # staging model is a dbt layer over data that has already landed.
  - id: ae-vs-bi-staging
    query: "Dựng lớp staging cho dữ liệu thô: đổi tên cột, ép kiểu và chuẩn hoá theo nguồn."
    expected_primary_skill: analytics-engineering
    rejected_skill: business-intelligence
    expected_task: ae-build-staging-model
