    rejected_skill: data-architecture
    expected_task: onboard-define-data-onboarding-standard
  - id: talent-vs-hod-role-profile
    query: "Viết mô tả vị trí Data Engineer sắp tuyển: sứ mệnh, kết quả mong đợi, trách nhiệm, ranh giới và cấp bậc."
    expected_primary_skill: data-talent-acquisition-and-interview
    rejected_skill: head-of-data-and-data-product
    expected_task: talent-define-data-role-profile
  # Haiku answers personal-second-brain. Tags, backlinks and versions are second-brain vocabulary,
  # so the pull is real. The case keeps the career skill because the library is interview
  # preparation with a defined use, not a general knowledge store.
  - id: career-vs-enable-knowledge-library
    query: Gom bộ câu hỏi phỏng vấn tôi đã soạn thành thư viện có tag, backlink và đánh phiên bản để tôi ôn.
