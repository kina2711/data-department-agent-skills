    rejected_skill: data-enablement-and-knowledge
    expected_task: brain-build-concept-map
  - id: book-vs-academy-knowledge-graph
    query: Từ quyển sách này, nối chương với chương theo prerequisite, framework, kỹ thuật và chỗ các tác giả mâu thuẫn nhau.
