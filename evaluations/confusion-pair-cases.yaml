  # Haiku answers data-governance-and-stewardship. Standards about lifecycle, gates, owners and
  # SLAs do read as governance, and the word "chuẩn" pulls that way on its own. The case keeps
  # onboarding because the standard governs how a source is taken on, not how the organisation
  # governs data generally. Recorded, not relaxed.
  - id: onboard-vs-arch-standard
    query: "Viết chuẩn cho việc tiếp nhận nguồn dữ liệu mới: vòng đời, nội dung bắt buộc, các cổng, ai sở hữu và SLA."
