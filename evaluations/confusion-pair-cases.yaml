    query: Đóng gói các phép biến đổi nghiệp vụ dùng lại được thành một lớp model trung gian trong dbt.
    expected_primary_skill: analytics-engineering
    rejected_skill: business-intelligence
    expected_task: ae-build-intermediate-model
  - id: ae-vs-mle-incremental
