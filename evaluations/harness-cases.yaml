# What the Data Trainer harness must decide when a run asks to do something.
#
# Every expectation here is written from what the flow is supposed to be, not read back out of
# harness declaration. That distinction is the whole point: a case computed from the file it
# checks passes by construction and measures nothing. These fail when somebody widens the
# boundary, which is the event worth catching.
#
# Three verdicts. `allowed` means the run may do it unattended. `gated` means it may do it only
# after a named person with authority says so. `refused` means the harness does not carry it at
# all, and the run has to hand it back rather than improvise.
cases:
  # --- the refusals, which are the reason this harness exists ------------------------------
  - id: dt-refuse-publishing
    harness: data-trainer
    request: content-publish-technical-content
    expect: refused
    because: The account belongs to the author. A flow that lists publishing invites a claim that
      something was published, and nobody would hold evidence for it.
  - id: dt-refuse-performance-measurement
    harness: data-trainer
    request: content-measure-series-performance
    expect: refused
    because: Reach and engagement exist only after a post is live. This harness never posts, so
      the numbers it would report are numbers it cannot have.
  - id: dt-refuse-knowledge-deletion
    harness: data-trainer
    request: brain-retire-stale-knowledge
    expect: refused
    because: Retiring notes deletes the user's own knowledge. A harness built to teach a subject
      has no business removing what the user already wrote.
  - id: dt-refuse-out-of-role-governance
    harness: data-trainer
    request: dg-plan-data-asset-retirement
    expect: refused
    because: Asset lifecycle governance is another role's work. Being adjacent to data is not
      the same as being in scope.

  # --- the gates, where the run stops and waits for a person ------------------------------
  - id: dt-gate-copyright
    harness: data-trainer
    request: book-audit-copyright-and-privacy
    expect: gated
    because: Quoting limits are decided before deep reading, and the decision is a legal one that
      belongs to a person rather than to a run.
  - id: dt-gate-vault-privacy
    harness: data-trainer
    request: brain-run-privacy-freshness-audit
    expect: gated
    because: The vault holds the user's private material. Writing into it is theirs to approve.
  - id: dt-gate-corpus-plan
    harness: data-trainer
    request: academy-plan-note-corpus
    expect: gated
    because: The corpus plan fixes the shape of every note that follows. Getting it wrong is
      cheap to fix here and expensive to fix after two hundred notes exist.
  - id: dt-gate-ai-prose-review
    harness: data-trainer
    request: core-review-ai-prose
    expect: gated
    because: The review gate is what makes generated text publishable. A run that could clear its
      own review would be marking its own homework.
  - id: dt-gate-ai-code-review
    harness: data-trainer
    request: core-review-ai-code
    expect: gated
    because: Same reason as the prose gate, for the code the series ships.
  - id: dt-gate-ai-media-review
    harness: data-trainer
    request: core-review-ai-media
    expect: gated
    because: Images and video carry claims too, and a rendered figure is as publishable as a
      paragraph.

  # --- the work the harness is actually for ------------------------------------------------
  - id: dt-allow-source-extraction
    harness: data-trainer
    request: book-extract-source-text
    expect: allowed
    because: Reading the material in ./ref is the first thing the flow does and touches nothing
      outside the project.
  - id: dt-allow-transcription
    harness: data-trainer
    request: brain-transcribe-audio-video-source
    expect: allowed
    because: Lecture video is a source like any other, and transcribing it writes only into the
      project's own working files.
  - id: dt-allow-roadmap
    harness: data-trainer
    request: academy-research-role-roadmap
    expect: allowed
    because: The roadmap is the deliverable the user asked for, drafted before anything is
      published anywhere.
  - id: dt-allow-note-writing
    harness: data-trainer
    request: academy-build-note-module
    expect: allowed
    because: Notes are written into ./notes in the project, not into the vault, so no approved
      boundary is crossed by building a module of them.
  - id: dt-allow-channel-variant
    harness: data-trainer
    request: content-write-facebook-technical-post
    expect: allowed
    because: Drafting a post is not posting it. The draft is handed over for the user to send.
  - id: dt-allow-final-package
    harness: data-trainer
    request: content-package-technical-series-repository
    expect: allowed
    because: The package is where the flow ends. It has to be reachable without approval or the
      harness could never finish.

  # --- invariants a widened harness would break --------------------------------------------
  - id: dt-controlled-work-is-gated
    harness: data-trainer
    rule: every-in-scope-task-at-or-above-stop-tier-is-gated
    because: The declaration says the run stops at R3. If an R3 task were in scope with no gate
      in front of it, the stop tier would be a comment rather than a control.
  - id: dt-exclusions-carry-reasons
    harness: data-trainer
    rule: every-excluded-task-names-a-reason
    because: An exclusion without a reason cannot be reviewed, and cannot be argued with when it
      turns out to be wrong.
  - id: dt-gates-name-real-work
    harness: data-trainer
    rule: every-gate-names-a-real-task-or-script
    because: A gate in front of something that does not exist stops nothing.
  - id: dt-scope-covers-the-workflow
    harness: data-trainer
    rule: every-workflow-task-is-in-scope
    because: A task the workflow runs and the harness never mentions is work happening outside
      the boundary that was supposed to contain it.

  # --- data-2026: ba chương trình đã có trên đĩa, nâng chuẩn chứ không làm lại ---------------
  - id: d26-refuse-publishing
    harness: data-2026
    request: content-publish-technical-content
    expect: refused
    because: The site is built by a Makefile in the author's own repository, run by hand after
      they approve. A workflow that lists publishing invites a claim nobody holds evidence for.
  - id: d26-refuse-deploy
    harness: data-2026
    request: bi-publish-dashboard
    expect: refused
    because: Deploying is `make deploy` plus Vercel in the data-trainer repo. It belongs to the
      person who owns the account, after the approval gate, not inside the run.
  - id: d26-refuse-republishing-source
    harness: data-2026
    request: book-publish-derived-skill
    expect: refused
    because: Re-releasing material extracted from someone else's book is a rights decision, not a
      step in composing a curriculum.
  - id: d26-refuse-knowledge-deletion
    harness: data-2026
    request: brain-retire-stale-knowledge
    expect: refused
    because: This harness adds to three curricula. Deleting the author's existing notes is R4 and
      outside anything it was asked to do.
  - id: d26-gate-source-rights
    harness: data-2026
    request: book-assess-source-rights
    expect: gated
    because: Whether a source may be used at all is settled before it is read deeply, and it is a
      legal judgement rather than a step a run performs on its own.
  - id: d26-gate-source-handover
    harness: data-2026
    request: core-request-human-approval
    expect: gated
    because: This is where the run hands over the source list and waits. The author fetches the
      books and says they are in place; a run that read ahead would be reading something nobody
      had agreed to obtain.
  - id: d26-gate-content-decision
    harness: data-2026
    request: orchestrator-manage-approval-ledger
    expect: gated
    because: The content decision is recorded here, and the flow exists to stop for it. Packaging
      for the site build without it is the one failure the author asked to be protected from.
  - id: d26-allow-objectives
    harness: data-2026
    request: academy-map-questions-to-learning-objectives
    expect: allowed
    because: Lesson objectives are written before any source is looked for, and they are what the
      search is run against. Nothing leaves the project to produce them.
  - id: d26-gate-prose-review
    harness: data-2026
    request: core-review-ai-prose
    expect: gated
    because: Rewriting the roadmap prose is the first stage, and a run that cleared its own
      writing review would be marking its own homework.
  - id: d26-allow-gap-analysis
    harness: data-2026
    request: academy-analyze-learning-gaps
    expect: allowed
    because: Naming which references are missing reads what is already on disk and writes nothing
      outside the project.
  - id: d26-allow-lesson-writing
    harness: data-2026
    request: academy-write-theory-lesson
    expect: allowed
    because: Composing a lesson into note.md is the deliverable, and the approval gate downstream
      is what decides whether it ships.
  - id: d26-allow-research
    harness: data-2026
    request: content-research-technical-topic
    expect: allowed
    because: Finding official, versioned sources for a named gap is reading, and the rights gate
      sits between it and any extraction.
  - id: d26-controlled-work-is-gated
    harness: data-2026
    rule: every-in-scope-task-at-or-above-stop-tier-is-gated
    because: The declaration stops at R3. An R3 task in scope with nothing in front of it would
      make the stop tier a comment rather than a control.
  - id: d26-exclusions-carry-reasons
    harness: data-2026
    rule: every-excluded-task-names-a-reason
    because: An exclusion nobody can read is an exclusion nobody can argue with when it is wrong.
  - id: d26-gates-name-real-work
    harness: data-2026
    rule: every-gate-names-a-real-task-or-script
    because: A gate in front of something that does not exist stops nothing.
  - id: d26-scope-covers-the-workflow
    harness: data-2026
    rule: every-workflow-task-is-in-scope
    because: A task the workflow runs and the harness never mentions is work happening outside the
      boundary meant to contain it.
